# Copy to .github/workflows/anchormem.yml to fail pull requests that leave memories stale.
name: anchormem
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so renames since each memory's commit can be detected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install git+https://github.com/ChiragPatankar/anchormem
      - run: anchormem check
